    const STATS_GLOSSARY = {
      pearson: {
        title: "Pearson Correlation Coefficient (r)",
        simple: "Measures the strength and direction of a linear relationship between two habits on a scale of -1 to +1.",
        apTip: "Always mention direction (positive/negative), form (linear), strength (weak/moderate/strong), and context! r has no units."
      },
      lsrl: {
        title: "Least-Squares Regression Line (ŷ = a + bx)",
        simple: "The mathematical 'line of best fit' that minimizes the sum of squared vertical residuals (errors).",
        apTip: "Exam template: 'For each additional 1-unit increase in [X], predicted [Y] increases/decreases by [b] [units]'."
      },
      r2: {
        title: "Coefficient of Determination (R²)",
        simple: "The percentage of variation in your response habit (e.g. Mood) that is explained by your explanatory habit (e.g. Screen Time).",
        apTip: "Standard FRQ phrasing: 'Approximately [R²]% of the variability in [Y] is accounted for by the linear model with [X]'."
      },
      iqr: {
        title: "Interquartile Range & 1.5 × IQR Outlier Rule",
        simple: "IQR = Q₃ - Q₁ (middle 50% of your data). Outliers are points that fall below Q₁ - 1.5×IQR or above Q₃ + 1.5×IQR.",
        apTip: "IQR and Median are 'resistant' to extreme outliers, while Mean and Standard Deviation are sensitive and get pulled toward the skew."
      },
      zScore: {
        title: "Standardized Z-Score: z = (x - μ) / σ",
        simple: "Tells you how many standard deviations a specific day's value was above (+) or below (-) your overall average.",
        apTip: "A z-score allows you to compare apples to oranges (e.g. was your 95-minute Khan study day more unusual than your 9-hour sleep day?)."
      },
      ci: {
        title: "95% Confidence Interval for the Mean",
        simple: "An estimated range of plausible values for your true long-term average habit, taking natural daily variation into account.",
        apTip: "Template: 'We are 95% confident that the true population mean for [Metric] lies between [Lower] and [Upper] [Units]'."
      }

    const PRESET_PASTEL_COLORS = [
      { name: 'Indigo', color: '#818CF8', bg: '#EDE7F6', darkBg: '#21244D' },
      { name: 'Rose', color: '#F472B6', bg: '#FCE7F3', darkBg: '#371B28' },
      { name: 'Mint', color: '#34D399', bg: '#E0F2F1', darkBg: '#133533' },
      { name: 'Lavender', color: '#A78BFA', bg: '#F3E5F5', darkBg: '#2A1F3D' },

      { name: 'Sky', color: '#38BDF8', bg: '#E0F7FA', darkBg: '#102A38' },
      { name: 'Peach', color: '#FB923C', bg: '#FFEDE0', darkBg: '#3A1E14' }
    ];

    function App() {
      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem('pastel_dark_mode_v6') === 'true';
      });

      useEffect(() => {
        localStorage.setItem('pastel_dark_mode_v6', darkMode);
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      const [metrics, setMetrics] = useState(() => {
        try {
          const saved = localStorage.getItem('pastel_metrics_v6');
          return saved ? JSON.parse(saved) : INITIAL_METRICS;
        } catch {
          return INITIAL_METRICS;
        }
      });

      const [entries, setEntries] = useState(() => {
        try {
          const saved = localStorage.getItem('pastel_entries_v6');
          return saved ? JSON.parse(saved) : INITIAL_DAYS;
        } catch {
          return INITIAL_DAYS;
        }
      });

      // Recycle bin for recently deleted days
      const [recentlyDeleted, setRecentlyDeleted] = useState(() => {
        try {
          const saved = localStorage.getItem('pastel_recently_deleted_v6');
          return saved ? JSON.parse(saved) : [];
        } catch {
          return [];
        }
      });

      const [todos, setTodos] = useState(() => {
        try {
          const saved = localStorage.getItem('pastel_todos_v6');
          return saved ? JSON.parse(saved) : [
            { id: 't1', text: 'Complete 30 min of SAT Math module drills', done: true },
            { id: 't2', text: 'Khan Academy calculus limit exercises', done: false },
            { id: 't3', text: 'Wind down by 10:30 PM for 8h sleep', done: false }
          ];
        } catch {
          return [];
        }
      });

      // Synchronize state with LocalStorage
      useEffect(() => {
        try { localStorage.setItem('pastel_metrics_v6', JSON.stringify(metrics)); } catch(e){}
      }, [metrics]);

      useEffect(() => {
        try { localStorage.setItem('pastel_entries_v6', JSON.stringify(entries)); } catch(e){}
      }, [entries]);

      useEffect(() => {
        try { localStorage.setItem('pastel_recently_deleted_v6', JSON.stringify(recentlyDeleted)); } catch(e){}
      }, [recentlyDeleted]);

      useEffect(() => {
        try { localStorage.setItem('pastel_todos_v6', JSON.stringify(todos)); } catch(e){}
      }, [todos]);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [normalizedMode, setNormalizedMode] = useState(true);
      const [showTrendlines, setShowTrendlines] = useState(true); // Toggle for LSRL trendlines

      // Multi-select entries in history
      const [selectedEntryIds, setSelectedEntryIds] = useState([]);

      // Metric filter toggles
      const [visibleMetrics, setVisibleMetrics] = useState(() => {
        const initial = {};
        INITIAL_METRICS.forEach(m => { initial[m.id] = true; });
        return initial;
      });

      // Interactive hover index
      const [hoveredDayIndex, setHoveredDayIndex] = useState(null);

      // Modals
      const [activeTooltip, setActiveTooltip] = useState(null);
      const [editingTargetMetric, setEditingTargetMetric] = useState(null);
      const [tempTargetVal, setTempTargetVal] = useState(0);
      const [editingBoundsMetric, setEditingBoundsMetric] = useState(null);
      const [isAddingMetric, setIsAddingMetric] = useState(false);
      const [editingEntry, setEditingEntry] = useState(null);
      const [showNotifications, setShowNotifications] = useState(false);
      const [showUndoBanner, setShowUndoBanner] = useState(false);

      // New Metric Creation State
      const [newMetricName, setNewMetricName] = useState('');
      const [newMetricEmoji, setNewMetricEmoji] = useState('💡');
      const [newMetricUnit, setNewMetricUnit] = useState('pts');
      const [newMetricMin, setNewMetricMin] = useState(0);
      const [newMetricMax, setNewMetricMax] = useState(10);
      const [newMetricStep, setNewMetricStep] = useState(1);
      const [newMetricTargetOp, setNewMetricTargetOp] = useState('>');
      const [newMetricTargetVal, setNewMetricTargetVal] = useState(5);
      const [newMetricColorObj, setNewMetricColorObj] = useState(PRESET_PASTEL_COLORS[0]);

      // Quick Logger form state
      const [formData, setFormData] = useState(() => {
        const initialForm = {
          date: new Date().toISOString().split('T')[0],
          note: ''
        };
        INITIAL_METRICS.forEach(m => {
          initialForm[m.id] = m.targetVal || m.min;
        });
        return initialForm;
      });

      // Regression & AP Stats state
      const [regX, setRegX] = useState('satStudy');
      const [regY, setRegY] = useState('mood');
      const [predictionX, setPredictionX] = useState(60);
      const [apMetric, setApMetric] = useState('satStudy');

      const [newTodoText, setNewTodoText] = useState('');
      const fileInputRef = useRef(null);

      // Check if any demo data still exists
      const hasDemoData = useMemo(() => {
        return entries.some(e => e.isDemo);
      }, [entries]);

      const getDayName = (dateStr) => {
        if (!dateStr) return 'Day';
        const parts = dateStr.split('-');
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()] || 'Day';
      };

      // Keep form and visible filters updated when metrics change
      useEffect(() => {
        setFormData(prev => {
          const next = { ...prev };
          metrics.forEach(m => {
            if (next[m.id] === undefined) next[m.id] = m.targetVal || m.min;
          });
          return next;
        });
        setVisibleMetrics(prev => {
          const next = { ...prev };
          metrics.forEach(m => {
            if (next[m.id] === undefined) next[m.id] = true;
          });
          return next;
        });
      }, [metrics]);

      const handleSaveEntry = (e) => {
        e.preventDefault();
        const dayName = getDayName(formData.date);
        const entryId = 'd_' + formData.date.replace(/-/g, '_') + '_' + Date.now().toString().slice(-4);

        const newEntry = {
          id: entryId,
          isDemo: false,
          date: formData.date,
          dayName,
          note: (formData.note || '').trim()
        };

        metrics.forEach(m => {
          newEntry[m.id] = formData[m.id] !== undefined ? Number(formData[m.id]) : m.min;
        });

        setEntries(prev => {
          const existingIdx = prev.findIndex(item => item.date === formData.date);
          let updated;
          if (existingIdx >= 0) {
            updated = [...prev];
            updated[existingIdx] = { ...newEntry, id: prev[existingIdx].id || entryId };
          } else {
            updated = [...prev, newEntry];
          }
          return updated.sort((a, b) => new Date(a.date) - new Date(b.date));
        });

        setFormData(prev => ({ ...prev, note: '' }));
        setActiveTab('dashboard');

      // Single entry deletion with recycle bin
      const handleDeleteSingleEntry = (idToDelete) => {
        const deletedItem = entries.find(e => e.id === idToDelete);
        if (!deletedItem) return;

        setRecentlyDeleted(prev => [deletedItem, ...prev]);
        setEntries(prev => prev.filter(e => e.id !== idToDelete));
        setSelectedEntryIds(prev => prev.filter(x => x !== idToDelete));
        setShowUndoBanner(true);

      const handleDeleteSelectedEntries = () => {

      const handleRestoreDeleted = () => {

        setRecentlyDeleted([]);
        setShowUndoBanner(false);

      // Clear only the starter demo data
      const handleClearStarterDemoData = () => {
        const demoItems = entries.filter(e => e.isDemo);
        setRecentlyDeleted(prev => [...demoItems, ...prev]);
        setEntries(prev => prev.filter(e => !e.isDemo));
        setSelectedEntryIds([]);
        setShowUndoBanner(true);
      };

      // Create new metric
      const handleCreateCustomMetric = (e) => {
        e.preventDefault();
        if (!newMetricName.trim()) return;

        const id = 'm_' + newMetricName.toLowerCase().replace(/[^a-z0-9]/g, '') + '_' + Date.now().toString().slice(-4);
        const newMetric = {
          id,
          name: newMetricName.trim(),
          emoji: newMetricEmoji || '✨',
          unit: newMetricUnit.trim() || 'pts',
          min: Number(newMetricMin) || 0,
          max: Number(newMetricMax) || 10,
          step: Number(newMetricStep) || 1,
          color: newMetricColorObj.color,
          bg: newMetricColorObj.bg,
          darkBg: newMetricColorObj.darkBg,
          targetOp: newMetricTargetOp,
          targetVal: Number(newMetricTargetVal) || 1
        };

        setMetrics(prev => [...prev, newMetric]);
        setIsAddingMetric(false);

        // Reset inputs
        setNewMetricName('');
        setNewMetricUnit('pts');
      };

      const computeRegression = (xKey, yKey) => {
        const pairs = entries
          .filter(e => e[xKey] !== undefined && e[yKey] !== undefined)
          .map(e => ({ x: Number(e[xKey]), y: Number(e[yKey]) }));

        const n = pairs.length;
        if (n < 2) return null;

        const sumX = pairs.reduce((acc, p) => acc + p.x, 0);
        const sumY = pairs.reduce((acc, p) => acc + p.y, 0);
        const meanX = sumX / n;
        const meanY = sumY / n;

        let num = 0, denX = 0, denY = 0;
        pairs.forEach(p => {
          const dx = p.x - meanX;
          const dy = p.y - meanY;
          num += dx * dy;
          denX += dx * dx;
          denY += dy * dy;
        });

        const r = denX === 0 || denY === 0 ? 0 : num / (Math.sqrt(denX) * Math.sqrt(denY));
        const slope = denX === 0 ? 0 : num / denX;
        const intercept = meanY - slope * meanX;
        const r2 = r * r;

        return { slope, intercept, r, r2, pairs, meanX, meanY, n };
      };

      const regStats = useMemo(() => computeRegression(regX, regY), [entries, regX, regY]);

      // Calculate time-series linear trendlines for each metric across logged days (t = 0 to N-1)
      const timelineTrendlines = useMemo(() => {
        const result = {};
        const n = entries.length;
        if (n < 2) return result;

        metrics.forEach(m => {
          let sumT = 0, sumY = 0, sumTY = 0, sumT2 = 0;
          entries.forEach((e, t) => {
            const y = Number(e[m.id]) || 0;
            sumT += t;
            sumY += y;
            sumTY += t * y;
            sumT2 += t * t;
          });
          const denom = (n * sumT2 - sumT * sumT);
          if (denom !== 0) {
            const slope = (n * sumTY - sumT * sumY) / denom;
            const intercept = (sumY - slope * sumT) / n;
            result[m.id] = { slope, intercept };
          }
        });
        return result;
      }, [entries, metrics]);

      const apStatsData = useMemo(() => {
        const values = entries
          .map(e => Number(e[apMetric]))
          .filter(v => !isNaN(v))
          .sort((a, b) => a - b);

        const n = values.length;
        if (n < 2) return null;

        const sum = values.reduce((a, b) => a + b, 0);
        const mean = sum / n;
        const variance = n > 1 ? values.reduce((acc, v) => acc + Math.pow(v - mean, 2), 0) / (n - 1) : 0;
        const s = Math.sqrt(variance);

        const min = values[0];
        const max = values[n - 1];

        const getPercentile = (p) => {
          const index = (values.length - 1) * p;
          const lower = Math.floor(index);
          const upper = Math.ceil(index);
          const weight = index % 1;
          if (lower === upper) return values[index];
          return values[lower] * (1 - weight) + values[upper] * weight;
        };

        const q1 = getPercentile(0.25);
        const median = getPercentile(0.50);
        const q3 = getPercentile(0.75);
        const iqr = q3 - q1;

        const lowerFence = q1 - 1.5 * iqr;
        const upperFence = q3 + 1.5 * iqr;
        const outliers = values.filter(v => v < lowerFence || v > upperFence);

        const tStar = 2.18;
        const marginOfError = n > 1 ? tStar * (s / Math.sqrt(n)) : 0;
        const ciLower = mean - marginOfError;
        const ciUpper = mean + marginOfError;

        return { n, values, mean, s, min, q1, median, q3, max, iqr, lowerFence, upperFence, outliers, ciLower, ciUpper };
      }, [entries, apMetric]);

                          const clampedNorm = Math.min(Math.max(norm, 0), 1);
                          const y = 240 - (clampedNorm * 220 + 10);
                          return { x, y, val };
                        });

                              y1={y1.toFixed(1)}

                              y2={y2.toFixed(1)}
                              stroke={m.color}

                            {pointsArray.map((p, idx) => {

                ) : (

                      />

                      <div className="flex-1">
                        <div className="flex justify-between items-center mb-1.5">
                          <span className="font-bold text-stone-800 dark:text-white">
                            {entry.date} ({entry.dayName})
                            {entry.isDemo && <span className="ml-2 text-[10px] text-stone-400 font-normal">[Sample Demo]</span>}
                          </span>
                          <div className="flex items-center gap-1">
                            <button 
                              onClick={() => setEditingEntry(entry)}
                              className="text-stone-400 hover:text-stone-600 dark:hover:text-stone-200 p-1"
                              title="Edit this day"
                            >
                              <Icon name="edit" className="w-3.5 h-3.5" />
                            </button>
                            <button 
                              onClick={() => handleDeleteSingleEntry(entry.id)}
                              className="text-stone-300 hover:text-rose-500 p-1"
                              title="Delete single day"
                            >
                              <Icon name="trash" className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>

                        {entry.note && (
                          <p className="text-[11px] text-stone-500 dark:text-stone-400 italic mb-2">"{entry.note}"</p>
                        )}

                        <div className="flex flex-wrap gap-1.5 text-[11px]">
                          {metrics.map(m => (
                            <span key={m.id} className="px-2 py-0.5 rounded-lg bg-stone-100 dark:bg-midnight-700 text-stone-600 dark:text-stone-300">
                              {m.emoji} {m.name}: <strong style={{ color: m.color }}>{entry[m.id] !== undefined ? entry[m.id] : '-'} {m.unit}</strong>
                            </span>
                          ))}
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}

          {}
          {isAddingMetric && (
            <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-in fade-in">
              <div className="bg-white dark:bg-midnight-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-stone-100 dark:border-midnight-700 space-y-3.5">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-stone-800 dark:text-white text-sm">Add New Trackable Metric</h3>
                  <button onClick={() => setIsAddingMetric(false)} className="text-stone-400">✕</button>
                </div>
                
                <form onSubmit={handleCreateCustomMetric} className="space-y-3">
                  <div className="grid grid-cols-3 gap-2">
                    <div className="col-span-2">
                      <label className="text-[10px] font-bold text-stone-400">Name</label>
                      <input 
                        type="text" 
                        placeholder="e.g. Vocabulary Drills" 
                        value={newMetricName} 
                        onChange={e => setNewMetricName(e.target.value)}
                        className="w-full px-2.5 py-1.5 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-stone-800 dark:text-white"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-stone-400">Emoji</label>
                      <input 
                        type="text" 
                        value={newMetricEmoji} 
                        onChange={e => setNewMetricEmoji(e.target.value)}
                        className="w-full px-2.5 py-1.5 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-center"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] font-bold text-stone-400">Unit Label</label>
                      <input 
                        type="text" 
                        placeholder="e.g. cards, min, pts" 
                        value={newMetricUnit} 
                        onChange={e => setNewMetricUnit(e.target.value)}
                        className="w-full px-2.5 py-1.5 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-stone-800 dark:text-white"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-stone-400">Target Criteria</label>
                      <div className="flex gap-1">
                        <select 
                          value={newMetricTargetOp}
                          onChange={e => setNewMetricTargetOp(e.target.value)}
                          className="px-1 py-1.5 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-900 text-stone-800 dark:text-white"
                        >
                          <option value=">">&gt;</option>
                          <option value="<">&lt;</option>
                        </select>
                        <input 
                          type="number" 
                          value={newMetricTargetVal} 
                          onChange={e => setNewMetricTargetVal(Number(e.target.value))}
                          className="w-full px-2 py-1.5 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-stone-800 dark:text-white font-bold"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-[10px] font-bold text-stone-400">Min</label>
                      <input 
                        type="number" 
                        value={newMetricMin} 
                        onChange={e => setNewMetricMin(Number(e.target.value))}
                        className="w-full px-2 py-1 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-stone-800 dark:text-white"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-stone-400">Max</label>
                      <input 
                        type="number" 
                        value={newMetricMax} 
                        onChange={e => setNewMetricMax(Number(e.target.value))}
                        className="w-full px-2 py-1 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-stone-800 dark:text-white"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-stone-400">Step</label>
                      <input 
                        type="number" 
                        value={newMetricStep} 
                        onChange={e => setNewMetricStep(Number(e.target.value))}
                        className="w-full px-2 py-1 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-stone-800 dark:text-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-stone-400 block mb-1">Color Palette</label>
                    <div className="flex gap-2">
                      {PRESET_PASTEL_COLORS.map(c => (
                        <button
                          key={c.name}
                          type="button"
                          onClick={() => setNewMetricColorObj(c)}
                          className={`w-6 h-6 rounded-full border-2 transition ${
                            newMetricColorObj.name === c.name ? 'border-stone-800 dark:border-white scale-110 shadow-xs' : 'border-transparent'
                          }`}
                          style={{ backgroundColor: c.color }}
                        />
                      ))}
                    </div>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button 
                      type="button"
                      onClick={() => setIsAddingMetric(false)}
                      className="flex-1 py-2 text-xs font-semibold rounded-xl bg-stone-100 dark:bg-midnight-700 text-stone-600 dark:text-stone-300"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit"
                      className="flex-1 py-2 text-xs font-semibold rounded-xl bg-indigo-500 text-white font-bold hover:bg-indigo-600 shadow-sm"
                    >
                      Create Metric
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          {activeTooltip && (
            <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-in fade-in">
              <div className="bg-white dark:bg-midnight-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-purple-100 dark:border-purple-900 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-stone-800 dark:text-white text-sm flex items-center gap-1.5">
                    <Icon name="info" className="w-4 h-4 text-purple-500" /> {activeTooltip.title}
                  </h3>
                  <button onClick={() => setActiveTooltip(null)} className="text-stone-400 hover:text-stone-600">✕</button>
                </div>
                
                <p className="text-xs text-stone-600 dark:text-stone-300 leading-relaxed">
                  {activeTooltip.simple}
                </p>

                <div className="p-3 bg-purple-50 dark:bg-purple-950/40 rounded-2xl border border-purple-100 dark:border-purple-900 text-xs">
                  <span className="font-bold text-purple-800 dark:text-purple-300 block mb-0.5">🎓 AP Exam Rubric Tip:</span>
                  <p className="text-[11px] text-stone-600 dark:text-stone-300 leading-relaxed font-mono">
                    {activeTooltip.apTip}
                  </p>
                </div>

                <button 
                  onClick={() => setActiveTooltip(null)}
                  className="w-full py-2 bg-stone-100 dark:bg-midnight-700 text-stone-700 dark:text-stone-200 text-xs font-bold rounded-xl"
                >
                  Got it!
                </button>
              </div>
            </div>
          )}

          {editingTargetMetric && (
            <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-in fade-in">
              <div className="bg-white dark:bg-midnight-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-stone-100 dark:border-midnight-700">
                <h3 className="font-bold text-stone-800 dark:text-white text-sm mb-1">
                  Adjust Target for {editingTargetMetric.emoji} {editingTargetMetric.name}
                </h3>
                <p className="text-xs text-stone-400 mb-4">Set your daily standard criteria</p>

                <div className="flex items-center gap-3 mb-4">
                  <span className="text-sm font-bold text-stone-700 dark:text-stone-200">{editingTargetMetric.targetOp}</span>
                  <input 
                    type="number"
                    step={editingTargetMetric.step}
                    value={tempTargetVal}
                    onChange={(e) => setTempTargetVal(Number(e.target.value))}
                    className="flex-1 px-3 py-2 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-stone-800 dark:text-white font-bold"
                  />
                  <span className="text-xs text-stone-500">{editingTargetMetric.unit}</span>
                </div>

                <div className="flex gap-2">
                  <button 
                    onClick={() => setEditingTargetMetric(null)}
                    className="flex-1 py-2 text-xs font-semibold rounded-xl bg-stone-100 dark:bg-midnight-700 text-stone-600 dark:text-stone-300"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={() => {
                      setMetrics(prev => prev.map(m => m.id === editingTargetMetric.id ? { ...m, targetVal: tempTargetVal } : m));
                      setEditingTargetMetric(null);
                    }}
                    className="flex-1 py-2 text-xs font-semibold rounded-xl bg-pink-400 text-white font-bold shadow-md shadow-pink-100"
                  >
                    Save Target
                  </button>
                </div>
              </div>
            </div>
          )}

          {editingBoundsMetric && (
            <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-in fade-in">
              <div className="bg-white dark:bg-midnight-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-stone-200 dark:border-midnight-700 space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-stone-800 dark:text-white text-sm">
                    Configure {editingBoundsMetric.emoji} {editingBoundsMetric.name}
                  </h3>
                  <button onClick={() => setEditingBoundsMetric(null)} className="text-stone-400">✕</button>
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="text-[10px] font-bold text-stone-400">Min</label>
                    <input 
                      type="number" 
                      value={editingBoundsMetric.min}
                      onChange={(e) => setEditingBoundsMetric({ ...editingBoundsMetric, min: Number(e.target.value) })}
                      className="w-full px-2 py-1.5 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-stone-800 dark:text-white"
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-stone-400">Max</label>
                    <input 
                      type="number" 
                      value={editingBoundsMetric.max}
                      onChange={(e) => setEditingBoundsMetric({ ...editingBoundsMetric, max: Number(e.target.value) })}
                      className="w-full px-2 py-1.5 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-stone-800 dark:text-white"
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-stone-400">Step</label>
                    <input 
                      type="number" 
                      value={editingBoundsMetric.step}
                      onChange={(e) => setEditingBoundsMetric({ ...editingBoundsMetric, step: Number(e.target.value) })}
                      className="w-full px-2 py-1.5 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-stone-800 dark:text-white"
                    />
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button 
                    onClick={() => {
                      if (metrics.length <= 1) {
                        alert("Must keep at least 1 metric!");
                        return;
                      }
                      setMetrics(prev => prev.filter(m => m.id !== editingBoundsMetric.id));
                      setEditingBoundsMetric(null);
                    }}
                    className="px-3 py-2 text-rose-500 bg-rose-50 dark:bg-rose-950/40 rounded-xl text-xs font-bold hover:bg-rose-100"
                  >
                    Delete Metric
                  </button>
                  <button 
                    onClick={() => {
                      setMetrics(prev => prev.map(m => m.id === editingBoundsMetric.id ? editingBoundsMetric : m));
                      setEditingBoundsMetric(null);
                    }}
                    className="flex-1 py-2 bg-indigo-400 text-white rounded-xl text-xs font-bold shadow-xs"
                  >
                    Save Bounds
                  </button>
                </div>
              </div>
            </div>
          )}

          {editingEntry && (
            <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50 animate-in fade-in">
              <div className="bg-white dark:bg-midnight-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-stone-200 dark:border-midnight-700 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-stone-800 dark:text-white text-sm">
                    Edit {editingEntry.date} ({editingEntry.dayName})
                  </h3>
                  <button onClick={() => setEditingEntry(null)} className="text-stone-400">✕</button>
                </div>

                <div className="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-1">
                  {metrics.map(m => (
                    <div key={m.id} className="flex justify-between items-center text-xs bg-stone-50 dark:bg-midnight-900 p-2 rounded-xl">
                      <span className="text-stone-700 dark:text-stone-200">{m.emoji} {m.name}</span>
                      <input 
                        type="number" 
                        value={editingEntry[m.id] ?? 0}
                        onChange={(e) => setEditingEntry({ ...editingEntry, [m.id]: Number(e.target.value) })}
                        className="w-20 px-2 py-1 text-xs text-right rounded-lg border border-stone-200 dark:border-midnight-700 bg-white dark:bg-midnight-800 text-stone-800 dark:text-white font-bold"
                      />
                    </div>
                  ))}
                  <div>
                    <label className="text-[10px] text-stone-400 font-bold block mb-1">Notes</label>
                    <input 
                      type="text" 
                      value={editingEntry.note || ''}
                      onChange={(e) => setEditingEntry({ ...editingEntry, note: e.target.value })}
                      className="w-full px-2.5 py-1.5 text-xs rounded-xl border border-stone-200 dark:border-midnight-700 bg-stone-50 dark:bg-midnight-950 text-stone-800 dark:text-white"
                    />
                  </div>
                </div>

                <button 
                  onClick={() => {
                    setEntries(prev => prev.map(e => e.id === editingEntry.id ? editingEntry : e));
                    setEditingEntry(null);
                  }}
                  className="w-full py-2.5 bg-indigo-400 text-white rounded-xl text-xs font-bold shadow-xs"
                >
                  Update Entry
                </button>
              </div>
            </div>
          )}

          {}
          <nav className="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-white/90 dark:bg-midnight-900/90 backdrop-blur-md px-3 py-2 rounded-full border border-stone-200/80 dark:border-midnight-800 shadow-lg flex justify-around items-center z-40 transition-colors">
            <button 
              onClick={() => setActiveTab('dashboard')}
              className={`flex flex-col items-center gap-0.5 text-[9px] font-semibold transition ${
                activeTab === 'dashboard' ? 'text-pink-500 scale-105' : 'text-stone-400'
              }`}
            >
              <Icon name="pulse" className="w-4 h-4" />
              <span>Trends</span>
            </button>
            <button 
              onClick={() => setActiveTab('statsLab')}
              className={`flex flex-col items-center gap-0.5 text-[9px] font-semibold transition ${
                activeTab === 'statsLab' ? 'text-purple-600 dark:text-purple-400 scale-105' : 'text-stone-400'
              }`}
            >
              <Icon name="graduation" className="w-4 h-4" />
              <span>AP Stats</span>
            </button>
            <button 
              onClick={() => setActiveTab('regression')}
              className={`flex flex-col items-center gap-0.5 text-[9px] font-semibold transition ${
                activeTab === 'regression' ? 'text-indigo-500 scale-105' : 'text-stone-400'
              }`}
            >
              <Icon name="calculator" className="w-4 h-4" />
              <span>Regression</span>
            </button>
            <button 
              onClick={() => setActiveTab('log')}
              className={`flex flex-col items-center gap-0.5 text-[9px] font-semibold transition ${
                activeTab === 'log' ? 'text-rose-500 scale-105' : 'text-stone-400'
              }`}
            >
              <Icon name="plus" className="w-4 h-4" />
              <span>Log Day</span>
            </button>
            <button 
              onClick={() => setActiveTab('todos')}
              className={`flex flex-col items-center gap-0.5 text-[9px] font-semibold transition ${
                activeTab === 'todos' ? 'text-teal-500 scale-105' : 'text-stone-400'
              }`}
            >
              <Icon name="checkSquare" className="w-4 h-4" />
              <span>To-Do</span>
            </button>
            <button 
              onClick={() => setActiveTab('history')}
              className={`flex flex-col items-center gap-0.5 text-[9px] font-semibold transition ${
                activeTab === 'history' ? 'text-amber-500 scale-105' : 'text-stone-400'
              }`}
            >
              <Icon name="history" className="w-4 h-4" />
              <span>History</span>
            </button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
