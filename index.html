<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PastelPulse — Routine & Correlation Tracker</title>
  
  <!-- Favicon / Home Screen Icon Support -->
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <meta name="theme-color" content="#FFFBF7">

  <!-- 1. Tailwind CSS (Styling Engine) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#FFFBF7',
              sand: '#F7EFE5',
              lavender: '#E6E6FA',
              rose: '#FAD2E1',
              mint: '#D8F3DC',
              peach: '#FFE5D9',
              amber: '#FDE2E4',
              sky: '#D0F4DE'
            }
          }
        }
      }
    }
  </script>

  <!-- 2. React, ReactDOM & Babel (allows running React directly in HTML) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #FFFBF7;
      color: #3B3836;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    input[type=range] {
      accent-color: #F472B6;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #E5E7EB;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-[#FFFBF7] min-h-screen">
  <div id="root"></div>

  <!-- Main Application Code (Executed via Babel) -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Inline Pastel Icon Components (Zero dependency) ---
    const Icon = ({ name, className = "w-5 h-5", color = "currentColor" }) => {
      const icons = {
        pulse: (
          <svg className={className} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        ),
        calculator: (
          <svg className={className} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <rect x="4" y="2" width="16" height="20" rx="2"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="16" y1="14" x2="16" y2="18"></line>
            <path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"></path>
          </svg>
        ),
        plus: (
          <svg className={className} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        ),
        download: (
          <svg className={className} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        ),
        edit: (
          <svg className={className} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        ),
        calendar: (
          <svg className={className} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        ),
        sparkles: (
          <svg className={className} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
          </svg>
        ),
        trash: (
          <svg className={className} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        )
      };
      return icons[name] || null;
    };

    // --- Initial Starter Data ---
    const INITIAL_METRICS = [
      { id: 'screenTime', name: 'Screen Time', unit: 'hrs', min: 0, max: 12, step: 0.1, color: '#F472B6', bg: '#FCE7F3', emoji: '📱', targetOp: '<', targetVal: 3.0 },
      { id: 'khanStudy', name: 'Khan Academy', unit: 'min', min: 0, max: 180, step: 5, color: '#34D399', bg: '#D1FAE5', emoji: '📚', targetOp: '>', targetVal: 45 },
      { id: 'sleep', name: 'Sleep', unit: 'hrs', min: 0, max: 12, step: 0.5, color: '#A78BFA', bg: '#EDE9FE', emoji: '🌙', targetOp: '>', targetVal: 7.5 },
      { id: 'mood', name: 'Mood', unit: '/10', min: 1, max: 10, step: 1, color: '#FBBF24', bg: '#FEF3C7', emoji: '✨', targetOp: '>', targetVal: 7 }
    ];

    const INITIAL_DAYS = [
      { date: '2026-09-14', dayName: 'Mon', screenTime: 4.5, khanStudy: 30, sleep: 6.5, mood: 5, note: 'Tired morning' },
      { date: '2026-09-15', dayName: 'Tue', screenTime: 3.8, khanStudy: 45, sleep: 7.0, mood: 6, note: 'Decent focus' },
      { date: '2026-09-16', dayName: 'Wed', screenTime: 1.2, khanStudy: 85, sleep: 8.5, mood: 9, note: 'Wednesday detox streak!' },
      { date: '2026-09-17', dayName: 'Thu', screenTime: 3.1, khanStudy: 50, sleep: 7.5, mood: 7, note: 'Good math review' },
      { date: '2026-09-18', dayName: 'Fri', screenTime: 5.2, khanStudy: 20, sleep: 6.0, mood: 4, note: 'Late night browsing' },
      { date: '2026-09-19', dayName: 'Sat', screenTime: 4.0, khanStudy: 60, sleep: 8.0, mood: 7, note: 'Relaxed day' },
      { date: '2026-09-20', dayName: 'Sun', screenTime: 3.6, khanStudy: 40, sleep: 7.5, mood: 6, note: 'Prepared for the week' },
      { date: '2026-09-21', dayName: 'Mon', screenTime: 4.2, khanStudy: 35, sleep: 6.8, mood: 5, note: 'Busy day' },
      { date: '2026-09-22', dayName: 'Tue', screenTime: 3.5, khanStudy: 55, sleep: 7.2, mood: 7, note: 'Solid routine' },
      { date: '2026-09-23', dayName: 'Wed', screenTime: 0.9, khanStudy: 95, sleep: 9.0, mood: 10, note: 'Super Wednesday flow!' },
      { date: '2026-09-24', dayName: 'Thu', screenTime: 2.8, khanStudy: 60, sleep: 7.8, mood: 8, note: 'Feeling sharp' },
      { date: '2026-09-25', dayName: 'Fri', screenTime: 5.0, khanStudy: 15, sleep: 6.2, mood: 4, note: 'Doomscrolled before bed' },
      { date: '2026-09-26', dayName: 'Sat', screenTime: 3.2, khanStudy: 70, sleep: 8.2, mood: 8, note: 'Khan Academy mastery test' }
    ];

    function App() {
      // Persistent States
      const [metrics, setMetrics] = useState(() => {
        const saved = localStorage.getItem('pastel_metrics');
        return saved ? JSON.parse(saved) : INITIAL_METRICS;
      });

      const [entries, setEntries] = useState(() => {
        const saved = localStorage.getItem('pastel_entries');
        return saved ? JSON.parse(saved) : INITIAL_DAYS;
      });

      useEffect(() => {
        localStorage.setItem('pastel_metrics', JSON.stringify(metrics));
      }, [metrics]);

      useEffect(() => {
        localStorage.setItem('pastel_entries', JSON.stringify(entries));
      }, [entries]);

      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'regression', 'log', 'history'
      const [normalizedMode, setNormalizedMode] = useState(true);
      const [showTrendlines, setShowTrendlines] = useState(false);
      
      // Target Edit Modal State
      const [editingTargetMetric, setEditingTargetMetric] = useState(null);
      const [tempTargetVal, setTempTargetVal] = useState(0);

      // New Metric Creation Modal
      const [isAddingMetric, setIsAddingMetric] = useState(false);
      const [newMetricData, setNewMetricData] = useState({
        name: '', unit: '', emoji: '✨', min: 0, max: 10, step: 1, color: '#F472B6', targetOp: '>', targetVal: 5
      });

      // Quick Logger Form State
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        note: ''
      });

      // Regression State
      const [regX, setRegX] = useState('screenTime');
      const [regY, setRegY] = useState('mood');
      const [predictionX, setPredictionX] = useState(2.0);

      // Calculate Day of Week
      const getDayName = (dateStr) => {
        const parts = dateStr.split('-');
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()];
      };

      // Math Helpers: Pearson Correlation & OLS Linear Regression
      const computeRegression = (xKey, yKey) => {
        const pairs = entries
          .filter(e => e[xKey] !== undefined && e[yKey] !== undefined)
          .map(e => ({ x: Number(e[xKey]), y: Number(e[yKey]) }));

        const n = pairs.length;
        if (n < 2) return null;

        const sumX = pairs.reduce((acc, p) => acc + p.x, 0);
        const sumY = pairs.reduce((acc, p) => acc + p.y, 0);
        const meanX = sumX / n;
        const meanY = sumY / n;

        let num = 0, denX = 0, denY = 0;
        pairs.forEach(p => {
          const dx = p.x - meanX;
          const dy = p.y - meanY;
          num += dx * dy;
          denX += dx * dx;
          denY += dy * dy;
        });

        const r = denX === 0 || denY === 0 ? 0 : num / (Math.sqrt(denX) * Math.sqrt(denY));
        const slope = denX === 0 ? 0 : num / denX;
        const intercept = meanY - slope * meanX;
        const r2 = r * r;

        // Standard Error
        const residuals = pairs.map(p => p.y - (slope * p.x + intercept));
        const sse = residuals.reduce((acc, res) => acc + res * res, 0);
        const se = n > 2 ? Math.sqrt(sse / (n - 2)) : 0;

        return { slope, intercept, r, r2, se, pairs, meanX, meanY };
      };

      const regStats = useMemo(() => computeRegression(regX, regY), [entries, regX, regY]);

      // Wednesday Pattern Finder
      const wednesdayStat = useMemo(() => {
        const weds = entries.filter(e => e.dayName === 'Wed');
        const others = entries.filter(e => e.dayName !== 'Wed');
        if (!weds.length || !others.length) return null;

        const avgScreenWed = weds.reduce((acc, d) => acc + (d.screenTime || 0), 0) / weds.length;
        const avgScreenOthers = others.reduce((acc, d) => acc + (d.screenTime || 0), 0) / others.length;
        const avgKhanWed = weds.reduce((acc, d) => acc + (d.khanStudy || 0), 0) / weds.length;
        const avgKhanOthers = others.reduce((acc, d) => acc + (d.khanStudy || 0), 0) / others.length;

        return {
          avgScreenWed: avgScreenWed.toFixed(1),
          avgScreenOthers: avgScreenOthers.toFixed(1),
          avgKhanWed: Math.round(avgKhanWed),
          avgKhanOthers: Math.round(avgKhanOthers),
          diffPercent: Math.round(((avgScreenOthers - avgScreenWed) / avgScreenOthers) * 100)
        };
      }, [entries]);

      // Handle Adding an Entry
      const handleSaveEntry = (e) => {
        e.preventDefault();
        const dayName = getDayName(formData.date);
        const newEntry = { ...formData, dayName };
        
        // Convert metric strings to numbers
        metrics.forEach(m => {
          if (newEntry[m.id] !== undefined) {
            newEntry[m.id] = Number(newEntry[m.id]);
          } else {
            newEntry[m.id] = m.min;
          }
        });

        const existsIndex = entries.findIndex(item => item.date === formData.date);
        if (existsIndex >= 0) {
          const updated = [...entries];
          updated[existsIndex] = newEntry;
          setEntries(updated.sort((a,b) => new Date(a.date) - new Date(b.date)));
        } else {
          setEntries([...entries, newEntry].sort((a,b) => new Date(a.date) - new Date(b.date)));
        }

        alert('✨ Entry saved successfully!');
        setActiveTab('dashboard');
      };

      // Export to CSV Function
      const exportCSV = () => {
        const headers = ['date', 'dayName', ...metrics.map(m => m.id), 'note'];
        const csvRows = [headers.join(',')];

        entries.forEach(row => {
          const values = headers.map(header => {
            const val = row[header] !== undefined ? row[header] : '';
            return `"${String(val).replace(/"/g, '""')}"`;
          });
          csvRows.push(values.join(','));
        });

        const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', `PastelPulse_Data_${new Date().toISOString().split('T')[0]}.csv`);
        a.click();
      };

      return (
        <div className="max-w-2xl mx-auto px-4 py-8 pb-28 font-sans">
          {/* Header */}
          <header className="flex justify-between items-center mb-6">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-2xl">🌸</span>
                <h1 className="text-2xl font-bold bg-gradient-to-r from-rose-400 via-purple-400 to-indigo-400 bg-clip-text text-transparent">
                  PastelPulse
                </h1>
              </div>
              <p className="text-xs text-stone-500 font-medium">Daily correlation & routine sandbox</p>
            </div>

            <div className="flex gap-2">
              <button 
                onClick={exportCSV} 
                title="Backup data to CSV spreadsheet"
                className="p-2.5 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-600 transition shadow-sm active:scale-95"
              >
                <Icon name="download" className="w-4 h-4" />
              </button>
              <button 
                onClick={() => setIsAddingMetric(true)}
                className="flex items-center gap-1 text-xs px-3.5 py-2 rounded-full bg-pink-100 text-pink-700 hover:bg-pink-200 font-semibold shadow-sm transition active:scale-95"
              >
                <Icon name="plus" className="w-3.5 h-3.5" /> New Metric
              </button>
            </div>
          </header>

          {/* Quick Target Bubbles (Click to Edit) */}
          <div className="flex gap-2 overflow-x-auto pb-3 custom-scrollbar mb-6">
            {metrics.map(m => {
              const latest = entries[entries.length - 1]?.[m.id] ?? 0;
              const isPassing = m.targetOp === '<' ? latest <= m.targetVal : latest >= m.targetVal;

              return (
                <div 
                  key={m.id}
                  onClick={() => {
                    setEditingTargetMetric(m);
                    setTempTargetVal(m.targetVal);
                  }}
                  className="flex-shrink-0 cursor-pointer p-3 rounded-2xl border transition-all duration-200 active:scale-95 shadow-sm"
                  style={{ backgroundColor: m.bg, borderColor: `${m.color}40` }}
                >
                  <div className="flex items-center justify-between gap-3 text-xs mb-1">
                    <span className="font-semibold text-stone-700">{m.emoji} {m.name}</span>
                    <span className="text-[10px] text-stone-400 flex items-center gap-0.5">
                      <Icon name="edit" className="w-2.5 h-2.5" /> Edit
                    </span>
                  </div>
                  <div className="text-lg font-bold text-stone-800">
                    {latest} <span className="text-xs font-normal text-stone-500">{m.unit}</span>
                  </div>
                  <div className={`text-[10px] font-medium mt-1 px-2 py-0.5 rounded-full inline-block ${isPassing ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                    Target: {m.targetOp} {m.targetVal} {m.unit}
                  </div>
                </div>
              );
            })}
          </div>

          {/* TAB 1: DASHBOARD */}
          {activeTab === 'dashboard' && (
            <div className="space-y-6">
              {/* Wednesday Detox Spotlight Card */}
              {wednesdayStat && (
                <div className="p-4 rounded-3xl bg-gradient-to-br from-emerald-50 via-teal-50 to-sky-50 border border-emerald-100 shadow-sm">
                  <div className="flex items-center gap-2 mb-2 text-emerald-800 font-semibold text-sm">
                    <Icon name="sparkles" className="w-4 h-4 text-emerald-500" />
                    <span>Your Wednesday Detox Trend</span>
                  </div>
                  <p className="text-xs text-stone-600 leading-relaxed">
                    You consistently spend <b className="text-emerald-700">{wednesdayStat.diffPercent}% less time</b> on your phone on Wednesdays ({wednesdayStat.avgScreenWed} hrs vs {wednesdayStat.avgScreenOthers} hrs average), and study <b className="text-emerald-700">+{wednesdayStat.avgKhanWed - wednesdayStat.avgKhanOthers} more mins</b> on Khan Academy!
                  </p>
                </div>
              )}

              {/* Time Series Multi-Line Graph */}
              <div className="bg-white p-5 rounded-3xl border border-stone-200/60 shadow-sm">
                <div className="flex justify-between items-center mb-4 flex-wrap gap-2">
                  <div>
                    <h2 className="font-bold text-stone-800 text-base">Timeline Trends</h2>
                    <p className="text-xs text-stone-400">Past {entries.length} logged days</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setNormalizedMode(!normalizedMode)}
                      className={`text-xs px-3 py-1 rounded-full font-medium transition ${normalizedMode ? 'bg-purple-100 text-purple-700 border border-purple-200' : 'bg-stone-100 text-stone-600'}`}
                    >
                      {normalizedMode ? 'Normalized (0-100%)' : 'Raw Values'}
                    </button>
                  </div>
                </div>

                {/* SVG Multi-Line Chart Canvas */}
                <div className="w-full h-56 relative border-b border-l border-stone-200">
                  <svg className="w-full h-full overflow-visible">
                    {/* Horizontal Guideline Grids */}
                    {[0, 25, 50, 75, 100].map((pct) => (
                      <line 
                        key={pct} 
                        x1="0%" 
                        y1={`${100 - pct}%`} 
                        x2="100%" 
                        y2={`${100 - pct}%`} 
                        stroke="#F3F4F6" 
                        strokeDasharray="4 4" 
                      />
                    ))}

                    {/* Metric Polylines */}
                    {metrics.map(m => {
                      const points = entries.map((entry, idx) => {
                        const x = (idx / (entries.length - 1)) * 100;
                        const val = entry[m.id] !== undefined ? entry[m.id] : m.min;
                        const normalizedY = ((val - m.min) / (m.max - m.min)) * 100;
                        const y = 100 - Math.min(Math.max(normalizedY, 0), 100);
                        return `${x}%,${y}%`;
                      }).join(' ');

                      return (
                        <g key={m.id}>
                          <polyline
                            fill="none"
                            stroke={m.color}
                            strokeWidth="2.5"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            points={points}
                            className="transition-all duration-300"
                          />
                          {entries.map((entry, idx) => {
                            const cx = `${(idx / (entries.length - 1)) * 100}%`;
                            const val = entry[m.id] !== undefined ? entry[m.id] : m.min;
                            const normalizedY = ((val - m.min) / (m.max - m.min)) * 100;
                            const cy = `${100 - Math.min(Math.max(normalizedY, 0), 100)}%`;
                            return (
                              <circle 
                                key={idx} 
                                cx={cx} 
                                cy={cy} 
                                r="3.5" 
                                fill="#ffffff" 
                                stroke={m.color} 
                                strokeWidth="2" 
                              />
                            );
                          })}
                        </g>
                      );
                    })}
                  </svg>
                </div>

                {/* X-Axis Day labels */}
                <div className="flex justify-between mt-2 text-[10px] text-stone-400 font-medium px-1">
                  {entries.map((d, i) => (
                    <span key={i} className={d.dayName === 'Wed' ? 'text-emerald-600 font-bold' : ''}>
                      {d.dayName}
                    </span>
                  ))}
                </div>

                {/* Legend */}
                <div className="flex flex-wrap gap-3 mt-4 pt-3 border-t border-stone-100 justify-center">
                  {metrics.map(m => (
                    <div key={m.id} className="flex items-center gap-1.5 text-xs text-stone-600">
                      <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: m.color }} />
                      <span>{m.name}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: LINEAR REGRESSION SANDBOX */}
          {activeTab === 'regression' && (
            <div className="space-y-6">
              <div className="bg-white p-5 rounded-3xl border border-stone-200/60 shadow-sm">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2">
                    <Icon name="calculator" className="w-5 h-5 text-indigo-400" />
                    <h2 className="font-bold text-stone-800 text-base">Linear Regression Sandbox</h2>
                  </div>
                  <span className="text-[11px] bg-indigo-50 text-indigo-600 font-medium px-2.5 py-1 rounded-full border border-indigo-100">
                    y = mx + b
                  </span>
                </div>

                {/* Metric Selector X vs Y */}
                <div className="grid grid-cols-2 gap-3 mb-5">
                  <div className="bg-stone-50 p-3 rounded-2xl border border-stone-200">
                    <label className="text-[10px] uppercase font-bold text-stone-400 block mb-1">Independent Variable (X)</label>
                    <select 
                      value={regX} 
                      onChange={(e) => setRegX(e.target.value)}
                      className="w-full bg-transparent text-xs font-semibold text-stone-700 outline-none"
                    >
                      {metrics.map(m => (
                        <option key={m.id} value={m.id}>{m.emoji} {m.name} ({m.unit})</option>
                      ))}
                    </select>
                  </div>

                  <div className="bg-stone-50 p-3 rounded-2xl border border-stone-200">
                    <label className="text-[10px] uppercase font-bold text-stone-400 block mb-1">Dependent Variable (Y)</label>
                    <select 
                      value={regY} 
                      onChange={(e) => setRegY(e.target.value)}
                      className="w-full bg-transparent text-xs font-semibold text-stone-700 outline-none"
                    >
                      {metrics.map(m => (
                        <option key={m.id} value={m.id}>{m.emoji} {m.name} ({m.unit})</option>
                      ))}
                    </select>
                  </div>
                </div>

                {regStats ? (
                  <>
                    {/* Math Nerd Stats Card */}
                    <div className="grid grid-cols-3 gap-2 mb-5 text-center">
                      <div className="p-2.5 bg-rose-50/50 rounded-2xl border border-rose-100">
                        <div className="text-[10px] text-stone-400">Slope (m)</div>
                        <div className="font-mono text-sm font-bold text-rose-600">{regStats.slope.toFixed(3)}</div>
                      </div>
                      <div className="p-2.5 bg-purple-50/50 rounded-2xl border border-purple-100">
                        <div className="text-[10px] text-stone-400">Pearson (r)</div>
                        <div className="font-mono text-sm font-bold text-purple-600">{regStats.r.toFixed(3)}</div>
                      </div>
                      <div className="p-2.5 bg-amber-50/50 rounded-2xl border border-amber-100">
                        <div className="text-[10px] text-stone-400">R² Fit</div>
                        <div className="font-mono text-sm font-bold text-amber-600">{(regStats.r2 * 100).toFixed(1)}%</div>
                      </div>
                    </div>

                    {/* Desmos-style Scatter Plot with Best Fit Trendline */}
                    <div className="w-full h-56 bg-stone-50/60 rounded-2xl border border-stone-200 relative p-4 flex items-center justify-center">
                      <svg className="w-full h-full overflow-visible">
                        {/* Grid */}
                        <line x1="0%" y1="50%" x2="100%" y2="50%" stroke="#E5E7EB" strokeDasharray="3 3"/>
                        <line x1="50%" y1="0%" x2="50%" y2="100%" stroke="#E5E7EB" strokeDasharray="3 3"/>

                        {/* Best Fit Line */}
                        {(() => {
                          const xMetric = metrics.find(m => m.id === regX) || { min: 0, max: 10 };
                          const yMetric = metrics.find(m => m.id === regY) || { min: 0, max: 10 };

                          const yAtMinX = regStats.slope * xMetric.min + regStats.intercept;
                          const yAtMaxX = regStats.slope * xMetric.max + regStats.intercept;

                          const normX1 = 0;
                          const normY1 = 100 - (((yAtMinX - yMetric.min) / (yMetric.max - yMetric.min)) * 100);
                          const normX2 = 100;
                          const normY2 = 100 - (((yAtMaxX - yMetric.min) / (yMetric.max - yMetric.min)) * 100);

                          return (
                            <line 
                              x1={`${normX1}%`} 
                              y1={`${Math.min(Math.max(normY1, 0), 100)}%`} 
                              x2={`${normX2}%`} 
                              y2={`${Math.min(Math.max(normY2, 0), 100)}%`} 
                              stroke="#6366F1" 
                              strokeWidth="2.5" 
                              strokeDasharray="4 2" 
                            />
                          );
                        })()}

                        {/* Scatter points */}
                        {regStats.pairs.map((p, i) => {
                          const xMetric = metrics.find(m => m.id === regX) || { min: 0, max: 10 };
                          const yMetric = metrics.find(m => m.id === regY) || { min: 0, max: 10 };

                          const cx = `${((p.x - xMetric.min) / (xMetric.max - xMetric.min)) * 100}%`;
                          const cy = `${100 - (((p.y - yMetric.min) / (yMetric.max - yMetric.min)) * 100)}%`;

                          return (
                            <circle 
                              key={i} 
                              cx={cx} 
                              cy={cy} 
                              r="4.5" 
                              fill="#F472B6" 
                              stroke="#ffffff" 
                              strokeWidth="1.5" 
                            />
                          );
                        })}
                      </svg>
                    </div>

                    {/* Prediction Slider */}
                    <div className="mt-5 p-4 rounded-2xl bg-indigo-50/40 border border-indigo-100">
                      <div className="flex justify-between items-center text-xs mb-2">
                        <span className="font-semibold text-stone-700">Predictive Calculator</span>
                        <span className="text-indigo-600 font-bold">{regX}: {predictionX}</span>
                      </div>
                      <input 
                        type="range"
                        min={metrics.find(m => m.id === regX)?.min || 0}
                        max={metrics.find(m => m.id === regX)?.max || 10}
                        step={metrics.find(m => m.id === regX)?.step || 0.1}
                        value={predictionX}
                        onChange={(e) => setPredictionX(Number(e.target.value))}
                        className="w-full h-1.5 bg-stone-200 rounded-lg cursor-pointer"
                      />
                      <div className="mt-3 text-center text-xs text-stone-600">
                        Predicted <b className="text-stone-800">{regY}</b>: {' '}
                        <span className="text-sm font-bold text-indigo-600">
                          {(regStats.slope * predictionX + regStats.intercept).toFixed(2)}
                        </span>
                      </div>
                    </div>
                  </>
                ) : (
                  <p className="text-xs text-stone-400 text-center py-6">Not enough data points yet.</p>
                )}
              </div>
            </div>
          )}

          {/* TAB 3: DAILY QUICK LOGGER */}
          {activeTab === 'log' && (
            <form onSubmit={handleSaveEntry} className="bg-white p-5 rounded-3xl border border-stone-200/60 shadow-sm space-y-4">
              <h2 className="font-bold text-stone-800 text-base mb-2">Log Daily Routine</h2>
              
              <div>
                <label className="text-xs font-semibold text-stone-600 block mb-1">Date</label>
                <input 
                  type="date" 
                  value={formData.date}
                  onChange={(e) => setFormData({ ...formData, date: e.target.value })}
                  className="w-full px-3 py-2 text-xs rounded-xl border border-stone-200 focus:outline-pink-400"
                  required 
                />
              </div>

              {metrics.map(m => (
                <div key={m.id} className="p-3 rounded-2xl bg-stone-50 border border-stone-100">
                  <div className="flex justify-between items-center text-xs mb-1 font-semibold text-stone-700">
                    <span>{m.emoji} {m.name}</span>
                    <span className="font-bold text-pink-600">{formData[m.id] ?? m.min} {m.unit}</span>
                  </div>
                  <input 
                    type="range"
                    min={m.min}
                    max={m.max}
                    step={m.step}
                    value={formData[m.id] ?? m.min}
                    onChange={(e) => setFormData({ ...formData, [m.id]: Number(e.target.value) })}
                    className="w-full h-1.5 bg-stone-200 rounded-lg cursor-pointer"
                  />
                </div>
              ))}

              <div>
                <label className="text-xs font-semibold text-stone-600 block mb-1">Reflection / Notes</label>
                <input 
                  type="text" 
                  placeholder="e.g., Felt super energetic after 9h sleep!"
                  value={formData.note}
                  onChange={(e) => setFormData({ ...formData, note: e.target.value })}
                  className="w-full px-3 py-2 text-xs rounded-xl border border-stone-200 focus:outline-pink-400"
                />
              </div>

              <button 
                type="submit" 
                className="w-full py-3 bg-gradient-to-r from-pink-400 to-rose-400 text-white rounded-2xl font-bold text-xs shadow-md shadow-pink-100 transition active:scale-95"
              >
                Save Daily Log
              </button>
            </form>
          )}

          {/* TAB 4: HISTORY & ENTRIES */}
          {activeTab === 'history' && (
            <div className="space-y-3">
              <h2 className="font-bold text-stone-800 text-base mb-2">Logged Days</h2>
              {entries.slice().reverse().map((entry, idx) => (
                <div key={idx} className="bg-white p-4 rounded-2xl border border-stone-200/60 shadow-sm text-xs">
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-bold text-stone-800">{entry.date} ({entry.dayName})</span>
                    {entry.note && <span className="text-[11px] text-stone-400 italic">"{entry.note}"</span>}
                  </div>
                  <div className="flex flex-wrap gap-2 text-[11px]">
                    {metrics.map(m => (
                      <span key={m.id} className="px-2.5 py-1 rounded-full bg-stone-100 text-stone-600">
                        {m.emoji} {entry[m.id] !== undefined ? entry[m.id] : '-'} {m.unit}
                      </span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* EDIT TARGET MODAL */}
          {editingTargetMetric && (
            <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-stone-100 animate-in fade-in zoom-in-95">
                <h3 className="font-bold text-stone-800 text-sm mb-1">
                  Adjust Target for {editingTargetMetric.emoji} {editingTargetMetric.name}
                </h3>
                <p className="text-xs text-stone-400 mb-4">Set your daily standard criteria</p>

                <div className="flex items-center gap-3 mb-4">
                  <span className="text-sm font-bold text-stone-700">{editingTargetMetric.targetOp}</span>
                  <input 
                    type="number"
                    step={editingTargetMetric.step}
                    value={tempTargetVal}
                    onChange={(e) => setTempTargetVal(Number(e.target.value))}
                    className="flex-1 px-3 py-2 text-xs rounded-xl border border-stone-200 focus:outline-pink-400 font-bold"
                  />
                  <span className="text-xs text-stone-500">{editingTargetMetric.unit}</span>
                </div>

                <div className="flex gap-2">
                  <button 
                    onClick={() => setEditingTargetMetric(null)}
                    className="flex-1 py-2 text-xs font-semibold rounded-xl bg-stone-100 text-stone-600 hover:bg-stone-200"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={() => {
                      setMetrics(metrics.map(m => m.id === editingTargetMetric.id ? { ...m, targetVal: tempTargetVal } : m));
                      setEditingTargetMetric(null);
                    }}
                    className="flex-1 py-2 text-xs font-semibold rounded-xl bg-pink-400 text-white hover:bg-pink-500 shadow-md shadow-pink-100"
                  >
                    Save Target
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CREATE METRIC MODAL */}
          {isAddingMetric && (
            <div className="fixed inset-0 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white w-full max-w-sm rounded-3xl p-5 shadow-2xl border border-stone-100 space-y-3">
                <h3 className="font-bold text-stone-800 text-sm">Add New Trackable Metric</h3>
                
                <div className="grid grid-cols-3 gap-2">
                  <div className="col-span-2">
                    <label className="text-[10px] font-bold text-stone-400">Name</label>
                    <input 
                      type="text" 
                      placeholder="e.g., Water Intake" 
                      value={newMetricData.name} 
                      onChange={e => setNewMetricData({ ...newMetricData, name: e.target.value })}
                      className="w-full px-2.5 py-1.5 text-xs rounded-xl border border-stone-200"
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-stone-400">Emoji</label>
                    <input 
                      type="text" 
                      value={newMetricData.emoji} 
                      onChange={e => setNewMetricData({ ...newMetricData, emoji: e.target.value })}
                      className="w-full px-2.5 py-1.5 text-xs rounded-xl border border-stone-200 text-center"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[10px] font-bold text-stone-400">Unit</label>
                    <input 
                      type="text" 
                      placeholder="e.g., cups, mins" 
                      value={newMetricData.unit} 
                      onChange={e => setNewMetricData({ ...newMetricData, unit: e.target.value })}
                      className="w-full px-2.5 py-1.5 text-xs rounded-xl border border-stone-200"
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-stone-400">Target Criteria</label>
                    <div className="flex gap-1">
                      <select 
                        value={newMetricData.targetOp}
                        onChange={e => setNewMetricData({ ...newMetricData, targetOp: e.target.value })}
                        className="px-1 py-1.5 text-xs rounded-xl border border-stone-200 bg-stone-50"
                      >
                        <option value=">">&gt;</option>
                        <option value="<">&lt;</option>
                      </select>
                      <input 
                        type="number" 
                        value={newMetricData.targetVal} 
                        onChange={e => setNewMetricData({ ...newMetricData, targetVal: Number(e.target.value) })}
                        className="w-full px-2 py-1.5 text-xs rounded-xl border border-stone-200"
                      />
                    </div>
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button 
                    onClick={() => setIsAddingMetric(false)}
                    className="flex-1 py-2 text-xs font-semibold rounded-xl bg-stone-100 text-stone-600"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={() => {
                      if (!newMetricData.name) return;
                      const id = newMetricData.name.toLowerCase().replace(/\s+/g, '');
                      setMetrics([...metrics, { ...newMetricData, id, min: 0, max: 10, step: 1, color: '#818CF8', bg: '#EEF2FF' }]);
                      setIsAddingMetric(false);
                    }}
                    className="flex-1 py-2 text-xs font-semibold rounded-xl bg-pink-400 text-white font-bold"
                  >
                    Create
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Bottom Navigation Dock */}
          <nav className="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-white/90 backdrop-blur-md px-3 py-2 rounded-full border border-stone-200/80 shadow-lg flex justify-around items-center z-40">
            <button 
              onClick={() => setActiveTab('dashboard')}
              className={`flex flex-col items-center gap-1 text-[10px] font-semibold transition ${activeTab === 'dashboard' ? 'text-pink-500 scale-105' : 'text-stone-400'}`}
            >
              <Icon name="pulse" className="w-5 h-5" />
              <span>Trends</span>
            </button>
            <button 
              onClick={() => setActiveTab('regression')}
              className={`flex flex-col items-center gap-1 text-[10px] font-semibold transition ${activeTab === 'regression' ? 'text-indigo-500 scale-105' : 'text-stone-400'}`}
            >
              <Icon name="calculator" className="w-5 h-5" />
              <span>Regression</span>
            </button>
            <button 
              onClick={() => setActiveTab('log')}
              className={`flex flex-col items-center gap-1 text-[10px] font-semibold transition ${activeTab === 'log' ? 'text-rose-500 scale-105' : 'text-stone-400'}`}
            >
              <Icon name="plus" className="w-5 h-5" />
              <span>Log Day</span>
            </button>
            <button 
              onClick={() => setActiveTab('history')}
              className={`flex flex-col items-center gap-1 text-[10px] font-semibold transition ${activeTab === 'history' ? 'text-amber-500 scale-105' : 'text-stone-400'}`}
            >
              <Icon name="calendar" className="w-5 h-5" />
              <span>History</span>
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
